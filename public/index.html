<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="简约毛玻璃风格的浏览器主页，支持自定义书签与搜索。">
  <title>主页 · Glass Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="layout">
    <aside class="sidebar glass" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">G</div>
        <div class="brand-text">
          <span class="brand-name">Glass Home</span>
          <span class="brand-sub">浏览器主页</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
          <span>首页</span>
        </button>
        <button class="nav-item" data-view="bookmarks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v16l-6-4-6 4V4z"/></svg>
          <span>书签</span>
        </button>
        <button class="nav-item" id="btn-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.14-1.4l2.1-1.6-2-3.4-2.4 1a7 7 0 0 0-2.4-1.4L13.7 2h-3.4l-.46 2.6a7 7 0 0 0-2.4 1.4l-2.4-1-2 3.4 2.1 1.6a7 7 0 0 0 0 2.8L3.1 14l2 3.4 2.4-1a7 7 0 0 0 2.4 1.4l.46 2.6h3.4l.46-2.6a7 7 0 0 0 2.4-1.4l2.4 1 2-3.4-2.1-1.6c.09-.46.14-.92.14-1.4z"/></svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="section-title">分类</div>
        <div class="category-list" id="category-list"></div>
      </div>

      <div class="sidebar-footer">
        <button class="icon-btn" id="btn-theme" title="切换主题" aria-label="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="greeting" id="greeting">你好，欢迎回来</h1>
        </div>
        <div class="topbar-right">
          <div class="date-chip glass" id="date-chip">2026-08-17</div>
        </div>
      </header>

      <section class="view active" id="view-home">
        <div class="clock-wrap">
          <div class="clock-time" id="clock-time">00:00:00</div>
          <div class="clock-date" id="clock-date">2026年08月17日 星期一</div>
        </div>

        <div class="home-right">
          <form class="search-bar glass" id="search-form" role="search">
            <div class="engine-select" id="engine-select" tabindex="0" aria-label="选择搜索引擎">
              <span class="engine-label" id="engine-label">Google</span>
              <svg class="engine-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
              <div class="engine-menu" id="engine-menu">
                <button type="button" class="engine-option active" data-engine="google">Google</button>
                <button type="button" class="engine-option" data-engine="bing">Bing</button>
                <button type="button" class="engine-option" data-engine="baidu">百度</button>
                <button type="button" class="engine-option" data-engine="github">GitHub</button>
                <button type="button" class="engine-option" data-engine="duckduckgo">DuckDuckGo</button>
              </div>
            </div>
            <input type="search" id="search-input" class="search-input" placeholder="搜索，或输入网址…" autocomplete="off" spellcheck="false">
            <button type="submit" class="search-btn" aria-label="搜索">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            </button>
          </form>

          <div class="bookmark-group" id="bookmark-group-home"></div>
        </div>
      </section>

      <section class="view" id="view-bookmarks">
        <div class="bookmarks-head">
          <h2>全部书签</h2>
          <button class="btn" id="btn-manage">管理书签</button>
        </div>
        <div class="bookmark-group all" id="bookmark-group-all"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">设置</h2>
        <button class="icon-btn" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="setting-block">
          <h3>默认搜索引擎</h3>
          <div class="engine-grid" id="settings-engine-grid"></div>
        </div>

        <div class="setting-block">
          <div class="setting-row">
            <h3>书签</h3>
            <button class="btn sm" id="btn-add-bookmark">+ 添加</button>
          </div>
          <ul class="bookmark-manage-list" id="bookmark-manage-list"></ul>
        </div>

        <div class="setting-block">
          <div class="setting-row">
            <h3>外观</h3>
          </div>
          <div class="setting-row">
            <label class="setting-label" for="theme-switch">深色模式</label>
            <label class="switch">
              <input type="checkbox" id="theme-switch">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-block">
          <button class="btn sm danger" id="btn-reset">恢复默认</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="edit-modal" hidden>
    <div class="modal glass modal-sm" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <div class="modal-head">
        <h2 id="edit-title">添加书签</h2>
        <button class="icon-btn" id="edit-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="bookmark-form">
        <input type="hidden" id="bm-id">
        <label class="field">
          <span>名称</span>
          <input type="text" id="bm-name" placeholder="例如：GitHub" required>
        </label>
        <label class="field">
          <span>URL</span>
          <input type="url" id="bm-url" placeholder="https://…" required>
        </label>
        <label class="field">
          <span>分类</span>
          <input type="text" id="bm-category" placeholder="例如：开发（留空为默认）">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="edit-cancel">取消</button>
          <button type="submit" class="btn" id="edit-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
